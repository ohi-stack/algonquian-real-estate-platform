name: WordPress Plugin Release Gate

on:
  push:
    branches:
      - main
      - 'agent/**'
      - 'feature/**'
      - 'release/**'
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  static-validation:
    name: Static installation readiness
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          coverage: none
          tools: none

      - name: Validate manifest JSON
        run: php -r "json_decode(file_get_contents('config/plugin-manifest.json'), true, 512, JSON_THROW_ON_ERROR); echo 'Manifest valid'.PHP_EOL;"

      - name: Run plugin package validator
        shell: bash
        run: |
          set +e
          php scripts/validate-wordpress-plugins.php 2>&1 | tee /tmp/algq-validator.log
          validator_status=${PIPESTATUS[0]}
          while IFS= read -r line; do
            if [[ "$line" == FAIL:* ]]; then
              safe_line=${line//'%'/'%25'}
              safe_line=${safe_line//$'\r'/'%0D'}
              safe_line=${safe_line//$'\n'/'%0A'}
              echo "::error title=Plugin validation::${safe_line}"
            elif [[ "$line" == WARNING:* ]]; then
              safe_line=${line//'%'/'%25'}
              safe_line=${safe_line//$'\r'/'%0D'}
              safe_line=${safe_line//$'\n'/'%0A'}
              echo "::warning title=Plugin validation::${safe_line}"
            fi
          done < /tmp/algq-validator.log
          exit "$validator_status"

      - name: Detect malformed WPBakery closing tags in executable source
        shell: bash
        run: |
          set -euo pipefail
          found=0
          for dir in plugin plugins modules; do
            if [ -d "$dir" ]; then
              if grep -RIn --include='*.php' --include='*.html' --include='*.txt' '</vc_column_text>' "$dir"; then
                found=1
              fi
            fi
          done
          if [ "$found" -ne 0 ]; then
            echo 'Malformed WPBakery closing tags were found in executable/source content.'
            exit 1
          fi

      - name: Detect prohibited debug statements
        shell: bash
        run: |
          set -euo pipefail
          found=0
          for dir in plugin plugins modules; do
            if [ -d "$dir" ]; then
              if grep -RInE --include='*.php' '(var_dump\(|print_r\(|error_reporting\(E_ALL\)|WP_DEBUG[^A-Z_])' "$dir"; then
                found=1
              fi
            fi
          done
          if [ "$found" -ne 0 ]; then
            echo 'Potential production debug output was found.'
            exit 1
          fi

  package-layout:
    name: Package layout policy
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Reject ZIP-only canonical sources
        shell: bash
        run: |
          set -euo pipefail
          zip_count=$(find . -path './.git' -prune -o -name '*.zip' -type f -print | wc -l | tr -d ' ')
          source_count=$(
            for dir in plugin plugins modules; do
              if [ -d "$dir" ]; then
                find "$dir" -name '*.php' -type f
              fi
            done | wc -l | tr -d ' '
          )
          echo "ZIP files: ${zip_count}"
          echo "PHP source files: ${source_count}"
          if [ "${zip_count}" -gt 0 ] && [ "${source_count}" -eq 0 ]; then
            echo 'Release ZIPs cannot be the only canonical source of record.'
            exit 1
          fi

      - name: Verify repository documentation
        shell: bash
        run: |
          set -euo pipefail
          test -f README.md
          test -f SECURITY.md
          test -f CHANGELOG.md
          test -f docs/wordpress-installation-readiness.md

  wordpress-smoke-test:
    name: WordPress smoke-test contract
    runs-on: ubuntu-latest
    needs:
      - static-validation
      - package-layout
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Confirm smoke-test documentation exists
        run: |
          grep -q 'Fresh WordPress installation' docs/wordpress-installation-readiness.md
          grep -q 'Activation testing' docs/wordpress-installation-readiness.md
          grep -q 'End-to-end workflow' docs/wordpress-installation-readiness.md

      - name: Report gate status
        run: |
          echo 'Static source checks passed.'
          echo 'A production release still requires execution of the documented WordPress activation and end-to-end test matrix against a disposable WordPress environment.'
