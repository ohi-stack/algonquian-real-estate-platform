name: WordPress Plugin Release

on:
  push:
    branches:
      - main
      - 'release/**'
      - 'agent/**'
    paths:
      - 'plugin/**'
      - 'plugins/**'
      - 'modules/**'
      - 'config/plugin-manifest.json'
      - 'scripts/**'
      - '.github/workflows/wordpress-plugin-release.yml'
  pull_request:
    paths:
      - 'plugin/**'
      - 'plugins/**'
      - 'modules/**'
      - 'config/plugin-manifest.json'
      - 'scripts/**'
      - '.github/workflows/wordpress-plugin-release.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package-layout:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Verify unpacked plugin source exists
        shell: bash
        run: |
          set -euo pipefail
          source_count=$(
            for dir in plugin plugins modules; do
              if [ -d "$dir" ]; then
                find "$dir" -type f -name '*.php'
              fi
            done | wc -l | tr -d ' '
          )
          if [ "${source_count}" = "0" ]; then
            echo "No unpacked WordPress plugin PHP source was found under plugin/, plugins/, or modules/."
            exit 1
          fi

      - name: Verify controlled release-status banner
        shell: bash
        run: |
          set -euo pipefail
          if ! grep -q "Production Candidate" README.md; then
            echo "README.md must retain the controlled Production Candidate release-status banner until deployment acceptance is complete."
            exit 1
          fi

  static-plugin-validation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Set up PHP 8.2
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          tools: none
          coverage: none

      - name: Run plugin manifest validator
        shell: bash
        run: |
          set +e
          php scripts/validate-wordpress-plugins.php 2>&1 | tee /tmp/algq-validator.log
          validator_status=${PIPESTATUS[0]}
          while IFS= read -r line; do
            if [[ "$line" == FAIL:* ]]; then
              safe_line=${line//'%'/'%25'}
              safe_line=${safe_line//$'\r'/'%0D'}
              safe_line=${safe_line//$'\n'/'%0A'}
              echo "::error title=Plugin validation::${safe_line}"
            elif [[ "$line" == WARNING:* ]]; then
              safe_line=${line//'%'/'%25'}
              safe_line=${safe_line//$'\r'/'%0D'}
              safe_line=${safe_line//$'\n'/'%0A'}
              echo "::warning title=Plugin validation::${safe_line}"
            fi
          done < /tmp/algq-validator.log
          exit "$validator_status"

      - name: Run production form validator
        shell: bash
        run: |
          set +e
          php scripts/validate-production-forms.php 2>&1 | tee /tmp/algq-form-validator.log
          validator_status=${PIPESTATUS[0]}
          while IFS= read -r line; do
            if [[ "$line" == FAIL:* ]]; then
              safe_line=${line//'%'/'%25'}
              safe_line=${safe_line//$'\r'/'%0D'}
              safe_line=${safe_line//$'\n'/'%0A'}
              echo "::error title=Production form validation::${safe_line}"
            elif [[ "$line" == WARNING:* ]]; then
              safe_line=${line//'%'/'%25'}
              safe_line=${safe_line//$'\r'/'%0D'}
              safe_line=${safe_line//$'\n'/'%0A'}
              echo "::warning title=Production form validation::${safe_line}"
            fi
          done < /tmp/algq-form-validator.log
          exit "$validator_status"

  php-lint:
    name: PHP ${{ matrix.php }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php:
          - '8.2'
    steps:
      - uses: actions/checkout@v5

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          tools: none
          coverage: none

      - name: Lint manifest plugin PHP files
        run: php scripts/lint-wordpress-plugins.php
